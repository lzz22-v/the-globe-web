<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="theGlobe" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#09080f"/>
    </linearGradient>
    <radialGradient id="halo" cx="500" cy="170" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".30"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="500" cy="170" r="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b3fd1" stop-opacity=".75"/><stop offset=".7" stop-color="#4c1d7a" stop-opacity=".45"/><stop offset="1" stop-color="#2a1050" stop-opacity=".25"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="globeClip"><circle cx="500" cy="170" r="105"/></clipPath>
  </defs>

  <rect width="1000" height="460" rx="18" fill="url(#bg)"/>
  <circle cx="500" cy="170" r="260" fill="url(#halo)"/>

  <!-- estrelas -->
  <g fill="#c4a1ff">
    <circle cx="120" cy="80" r="1.3"><animate attributeName="opacity" values=".15;.8;.15" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="120" r="1.5"><animate attributeName="opacity" values=".8;.15;.8" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="330" r="1.2"><animate attributeName="opacity" values=".2;.7;.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="300" r="1.2"><animate attributeName="opacity" values=".7;.15;.7" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="50" r="1.1"><animate attributeName="opacity" values=".2;.9;.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="40" r="1.3"><animate attributeName="opacity" values=".6;.1;.6" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- esfera -->
  <circle cx="500" cy="170" r="105" fill="url(#sphere)"/>
  <g clip-path="url(#globeClip)" fill="none" stroke="#a855f7" stroke-width="1" opacity=".5">
    <!-- paralelos -->
    <line x1="395" y1="170" x2="605" y2="170"/>
    <ellipse cx="500" cy="170" rx="105" ry="26"/>
    <ellipse cx="500" cy="123" rx="91" ry="22"/>
    <ellipse cx="500" cy="217" rx="91" ry="22"/>
    <ellipse cx="500" cy="80"  rx="52" ry="13"/>
    <ellipse cx="500" cy="260" rx="52" ry="13"/>
    <!-- meridianos em rotação -->
    <ellipse cx="500" cy="170" rx="105" ry="105">
      <animate attributeName="rx" dur="16s" begin="0s" repeatCount="indefinite" values="105;101.4;90.9;74.2;52.5;27.2;0;27.2;52.5;74.2;90.9;101.4;105"/>
    </ellipse>
    <ellipse cx="500" cy="170" rx="105" ry="105">
      <animate attributeName="rx" dur="16s" begin="-4s" repeatCount="indefinite" values="105;101.4;90.9;74.2;52.5;27.2;0;27.2;52.5;74.2;90.9;101.4;105"/>
    </ellipse>
    <ellipse cx="500" cy="170" rx="105" ry="105">
      <animate attributeName="rx" dur="16s" begin="-8s" repeatCount="indefinite" values="105;101.4;90.9;74.2;52.5;27.2;0;27.2;52.5;74.2;90.9;101.4;105"/>
    </ellipse>
    <ellipse cx="500" cy="170" rx="105" ry="105">
      <animate attributeName="rx" dur="16s" begin="-12s" repeatCount="indefinite" values="105;101.4;90.9;74.2;52.5;27.2;0;27.2;52.5;74.2;90.9;101.4;105"/>
    </ellipse>
  </g>
  <circle cx="500" cy="170" r="105" fill="none" stroke="#a855f7" stroke-width="1.6" opacity=".85"/>

  <!-- órbitas sutis -->
  <circle cx="500" cy="170" r="150" fill="none" stroke="#a855f7" stroke-opacity=".10" stroke-dasharray="2 8"/>
  <circle cx="500" cy="170" r="130" fill="none" stroke="#a855f7" stroke-opacity=".08" stroke-dasharray="2 8"/>

  <!-- pontos luminosos -->
  <g filter="url(#glow)" fill="#c084fc">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 500 170" to="360 500 170" dur="18s" repeatCount="indefinite"/>
      <circle cx="396.6" cy="151.8" r="4.5"><animate attributeName="opacity" values="1;.5;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="605" cy="170" r="2.5"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 500 170" to="0 500 170" dur="26s" repeatCount="indefinite"/>
      <circle cx="425" cy="300" r="3.5"><animate attributeName="opacity" values=".5;1;.5" dur="4s" repeatCount="indefinite"/></circle>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 500 170" to="360 500 170" dur="40s" repeatCount="indefinite"/>
      <circle cx="565" cy="57.4" r="3"/>
    </g>
  </g>

  <!-- título -->
  <text x="500" y="372" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-2">theGlobe</text>
  <text x="500" y="412" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#9a94ad">Junte-se à comunidade. Crie personagens, entre em salas e co-escreva histórias inesquecíveis.</text>
</svg>
