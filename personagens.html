<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>theGlobe - Carteira de Personagens</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111216">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="theGlobe">
    <link rel="icon" type="image/png" href="/src/theGlobe-logo-colorida.png">
    <link rel="apple-touch-icon" href="/src/theGlobe-logo-colorida.png">
    <script type="module" src="src/js/pwa.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/personagens.css">
    <link rel="stylesheet" href="src/css/brand.css?v=20261025-brand-2">
    <link rel="stylesheet" href="src/css/scrollbars.css">
    <link rel="stylesheet" href="src/css/responsive.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">the<span>Globe</span></div>
                <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>

            <div class="user-card" style="cursor: pointer;" onclick="window.location.href='profile.html'" title="Abrir meu perfil">
                <div class="avatar-wrapper">
                    <img id="sidebar-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Foto de perfil">
                    <span class="status-dot"></span>
                </div>
                <div class="user-info">
                    <h4 id="sidebar-name">Carregando...</h4>
                    <span id="sidebar-email">...</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <span class="nav-label">MENU</span>
                <a href="rooms.html" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span class="nav-item-label">Minhas salas</span>
                </a>
                <a href="personagens.html" class="nav-item active">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>
                    <span class="nav-item-label">Carteira de personagens</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <span>theGlobe v1.0.0-prototype</span>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div class="header-titles">
                    <h1>Carteira de personagens</h1>
                    <p id="character-count">0 personagens criados</p>
                </div>
                <button class="btn-primary" id="btn-create-character">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Criar personagem
                </button>
            </header>

            <div class="folder-toolbar" id="folder-toolbar">
                <button type="button" class="folder-nav-button hidden" id="btn-back-folders">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 4px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Pastas
                </button>
                <strong id="current-folder-title">Suas pastas</strong>
                <div class="folder-toolbar-actions">
                    <button type="button" class="btn-secondary" id="btn-create-folder">+ Nova pasta</button>
                    <button type="button" class="btn-secondary hidden" id="btn-rename-folder">Renomear</button>
                    <button type="button" class="btn-secondary folder-delete-button hidden" id="btn-delete-folder">Excluir pasta</button>
                </div>
            </div>

            <div class="character-wallet-progress hidden" id="wallet-loading" role="status" aria-live="polite">
                <span class="character-wallet-progress-label">Carregando pastas e personagens...</span>
                <span class="character-wallet-progress-track" role="progressbar" aria-label="Carregando personagens" aria-valuetext="Carregamento em andamento"><span></span></span>
            </div>
            <section class="character-grid" id="character-grid">
            </section>
        </main>
    </div>

    <div class="modal-overlay hidden" id="modal-personagem">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modal-title">Criar personagem</h2>
                <button class="btn-close" id="btn-close-modal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <form id="form-personagem" class="modal-body">
                <input type="hidden" id="char-id-input" value="">

                <div class="form-group">
                    <label class="form-label">FOTO DO PERSONAGEM</label>
                    <div class="upload-dropzone" id="upload-dropzone">
                        <input type="file" id="input-avatar-file" accept="image/*" hidden>
                        <div class="dropzone-content" id="dropzone-content">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            <span class="dropzone-title">Clique ou arraste</span>
                            <span class="dropzone-sub">Quadrado recomendado (1:1)</span>
                        </div>
                        <img id="avatar-preview" class="avatar-preview hidden" src="" alt="Preview">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">NOME DO PERSONAGEM</label>
                    <input type="text" id="input-char-name" class="form-input" placeholder="Ex: Elara Sombria" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="input-char-folder">PASTA</label>
                    <select id="input-char-folder" class="form-input">
                        <option value="">Sem pasta</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" id="relevance-group-label">RELEVÂNCIA / ETIQUETA</label>
                    <select id="input-char-relevance" class="relevance-value-source" aria-hidden="true" tabindex="-1">
                        <option value="protagonista">Protagonista (Fixado no topo)</option>
                        <option value="coadjuvante">Coadjuvante</option>
                        <option value="secundario" selected>Secundário</option>
                        <option value="figurante">Figurante</option>
                        <option value="multidao">Multidão</option>
                        <option value="narrador">Narrador</option>
                    </select>
                    <div class="relevance-choice-list" id="relevance-choice-list" role="radiogroup" aria-labelledby="relevance-group-label">
                        <button type="button" class="relevance-choice" role="radio" aria-checked="false" data-relevance="protagonista">
                            <span class="relevance-choice-icon" aria-hidden="true"></span>
                            <span class="relevance-choice-text">Protagonista</span>
                        </button>
                        <button type="button" class="relevance-choice" role="radio" aria-checked="false" data-relevance="coadjuvante">
                            <span class="relevance-choice-icon" aria-hidden="true"></span>
                            <span class="relevance-choice-text">Coadjuvante</span>
                        </button>
                        <button type="button" class="relevance-choice" role="radio" aria-checked="true" data-relevance="secundario">
                            <span class="relevance-choice-icon" aria-hidden="true"></span>
                            <span class="relevance-choice-text">Secundário</span>
                        </button>
                        <button type="button" class="relevance-choice" role="radio" aria-checked="false" data-relevance="figurante">
                            <span class="relevance-choice-icon" aria-hidden="true"></span>
                            <span class="relevance-choice-text">Figurante</span>
                        </button>
                        <button type="button" class="relevance-choice" role="radio" aria-checked="false" data-relevance="multidao">
                            <span class="relevance-choice-icon" aria-hidden="true"></span>
                            <span class="relevance-choice-text">Multidão</span>
                        </button>
                        <button type="button" class="relevance-choice" role="radio" aria-checked="false" data-relevance="narrador">
                            <span class="relevance-choice-icon" aria-hidden="true"></span>
                            <span class="relevance-choice-text">Narrador</span>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">DESCRIÇÃO</label>
                    <textarea id="input-char-desc" class="form-textarea" placeholder="Descreva o histórico, personalidade e motivações do personagem..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">COR DO PERSONAGEM</label>
                    <div class="color-palette" id="color-palette">
                    </div>
                    <div class="selected-color-badge">
                        <span class="badge-dot" id="badge-color-dot"></span>
                        <span id="badge-color-hex">#9B30FF</span>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="btn-cancel-modal">Cancelar</button>
                    <button type="submit" class="btn-primary-modal" id="btn-save-char">Salvar personagem</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay hidden" id="modal-folder">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="folder-modal-title">Criar pasta</h2>
                <button type="button" class="btn-close" id="btn-close-folder-modal" aria-label="Fechar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <form id="form-folder" class="modal-body">
                <input type="hidden" id="folder-id-input">
                <div class="form-group">
                    <label class="form-label" for="input-folder-name">NOME DA PASTA</label>
                    <input type="text" id="input-folder-name" class="form-input" maxlength="80" placeholder="Ex: Sessão de inverno" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="btn-cancel-folder-modal">Cancelar</button>
                    <button type="submit" class="btn-primary-modal">Salvar pasta</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="src/js/personagens/personagens.js"></script>
</body>
</html>
